# Checks EWRB news every Monday morning (NZ time) for Wiring Rules amendments, rulings or new editions,
# and adds anything new to updates.json. The app then shows an alert the next time it opens.
name: Check EWRB for Wiring Rules updates
on:
  schedule:
    - cron: "0 19 * * 0"   # 19:00 UTC Sunday = Monday 7-8 am in NZ
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check EWRB news
        run: python .github/scripts/check_ewrb.py
      - name: Save any changes
        run: |
          if git diff --quiet -- updates.json; then echo "No new Wiring Rules news."; exit 0; fi
          git config user.name "wiring-rules-bot"
          git config user.email "actions@users.noreply.github.com"
          git add updates.json
          git commit -m "Add Wiring Rules update from EWRB news"
          git push
